name: CI

on:
  push:
    branches: [master, beta]
  pull_request:
    branches: [master, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  ci:
    name: Lint + Build + Test
    runs-on: ubuntu-latest-large
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Artifactory OIDC Auth
        uses: ./.github/actions/artifactory-oidc
      - name: Devbox Bootstrap (Artifactory-only)
        uses: ./.github/actions/devbox-bootstrap
      - name: Install dependencies
        run: |
          set -o pipefail
          devbox run --pure ci:install 2>&1 | tee /tmp/yarn-install.log
      - name: Curation Audit (on install failure)
        if: failure()
        uses: ./.github/actions/curation-audit
        with:
          install-log: /tmp/yarn-install.log
      - name: Lint (eslint)
        run: devbox run --pure lint
      - name: Lint (formatting)
        run: devbox run --pure format-check
      - name: Build
        run: devbox run --pure build
      - name: Typecheck
        run: devbox run --pure typecheck
      - name: Test
        run: devbox run --pure test

  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest-large
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Artifactory OIDC Auth
        uses: ./.github/actions/artifactory-oidc
      - name: Devbox Bootstrap (Artifactory-only)
        uses: ./.github/actions/devbox-bootstrap
      - name: Install dependencies
        run: |
          set -o pipefail
          devbox run --pure ci:install 2>&1 | tee /tmp/yarn-install.log
      - name: Curation Audit (on install failure)
        if: failure()
        uses: ./.github/actions/curation-audit
        with:
          install-log: /tmp/yarn-install.log
      - name: Validate PR title
        run: devbox run --pure ci:commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
