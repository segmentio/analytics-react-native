name: 'Curation Audit'
description: 'Pre-flight JFrog curation audit of every package resolved in yarn.lock, so a blocked package fails fast with a clear policy reason instead of a multi-minute yarn install hang'

runs:
  using: 'composite'
  steps:
    - name: Extract resolved npm packages from yarn.lock
      shell: bash
      run: |
        set -euo pipefail
        WORKDIR=$(mktemp -d)
        echo "AUDIT_WORKDIR=$WORKDIR" >> "$GITHUB_ENV"

        python3 - yarn.lock "$WORKDIR" <<'PYEOF'
        import sys, json, os

        lockfile, workdir = sys.argv[1], sys.argv[2]
        deps = {}
        with open(lockfile, encoding="utf-8") as f:
            for line in f:
                line = line.rstrip("\n")
                if line.startswith("  resolution:"):
                    val = line.split(":", 1)[1].strip().strip('"')
                    if "@npm:" in val:
                        name, version = val.rsplit("@npm:", 1)
                        deps[name] = version

        pkg = {
            "name": "curation-audit-synthetic",
            "version": "1.0.0",
            "private": True,
            "dependencies": deps,
        }
        with open(os.path.join(workdir, "package.json"), "w") as f:
            json.dump(pkg, f, indent=2)
        print(f"Extracted {len(deps)} resolved npm package(s) from yarn.lock")
        PYEOF

        host=$(echo "${ARTIFACTORY_URL}" | sed -E 's#https?://##')
        cat > "$WORKDIR/.npmrc" <<EOF
        registry=${ARTIFACTORY_URL}/artifactory/api/npm/virtual-npm-thirdparty/
        //${host}/artifactory/api/npm/virtual-npm-thirdparty/:_authToken=${YARN_NPM_AUTH_TOKEN}
        EOF

    - name: Install jf CLI
      shell: bash
      run: |
        curl -fkL https://getcli.jfrog.io/v2-jf | sh
        sudo mv jf /usr/local/bin/jf

    - name: Configure jf against the SDK build lane
      shell: bash
      run: |
        jf c add curation-audit-server \
          --url="${ARTIFACTORY_URL}" \
          --access-token="${YARN_NPM_AUTH_TOKEN}" \
          --interactive=false \
          --overwrite
        jf c use curation-audit-server

    - name: Run curation audit
      shell: bash
      working-directory: ${{ env.AUDIT_WORKDIR }}
      run: |
        echo "::group::Pre-flight curation audit of every package resolved in yarn.lock"
        jf ca --run-native --format=table
        echo "::endgroup::"
